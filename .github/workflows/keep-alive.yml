name: Keep Render Backend Active (24/7)

on:
  schedule:
    # Run every 12 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  keep_alive:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          echo "========================================================"
          echo "Pinging VoteSphere Backend to prevent Render spin-down..."
          echo "========================================================"
          
          # Target URL priority: GitHub Secret BACKEND_URL > Default Render backend URL
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://votesphere-backend.onrender.com"
          fi
          
          TARGET="${BACKEND_URL%/}/api/health"
          echo "Target URL: $TARGET"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "$TARGET" || echo "FAILED")
          echo "HTTP Response Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "503" ]; then
            echo "SUCCESS: Render backend is awake and responding! Inactivity timer reset."
          else
            echo "Ping delivered (status: $HTTP_STATUS). Backend wakeup initiated."
          fi
