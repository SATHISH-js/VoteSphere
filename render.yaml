services:
  # 1. Backend Go/Gin Web Service
  - type: web
    name: votesphere-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: GIN_MODE
        value: release
      - key: MONGO_DATABASE
        value: votesphere
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # 2. Frontend React/Vite Static Site
  - type: web
    name: votesphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
